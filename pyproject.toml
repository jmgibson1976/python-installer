[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "Installer"
version = "0.0.1"
description = "Project Installer: A python CLI tool to install a base project structure for a new python project."
readme = "README.md"
requires-python = ">=3.13"
authors = [{ name = "Jeremy M. Gibson", email = "jeremy@jeremymgibson.com" }]
keywords = [""]
dependencies = [
    "requests",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "black",
    "pre-commit",
    "detect-secrets",
]

[tool.setuptools]
packages = ["sketch"]
include-package-data = false

[project.scripts]
sketch = "sketch.__main__:main"
